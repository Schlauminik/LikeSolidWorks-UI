<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Mittelpunktlinie</title>
  <!-- Linie schraeg, symmetrisch um den Mittelpunkt -->
  <line x1="8" y1="50" x2="56" y2="14" stroke="#d81f26" stroke-width="5" stroke-linecap="round"/>
  <!-- Endpunkte -->
  <circle cx="8" cy="50" r="5" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.5"/>
  <circle cx="56" cy="14" r="5" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.5"/>
  <!-- Mittelpunkt hervorgehoben -->
  <circle cx="32" cy="32" r="7.5" fill="#3c8dd9" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Pfeile: waechst in beide Richtungen -->
  <path d="M20 50 L13 56 M44 14 L51 8" stroke="#3a3a3a" stroke-width="2.5" stroke-linecap="round"/>
</svg>
